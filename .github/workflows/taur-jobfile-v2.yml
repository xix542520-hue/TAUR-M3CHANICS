name: TAUR JOB FILE V2

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jobfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Job File module
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="taur-jobfile-xip-v2.js"></script>'
          old='<script src="taur-jobfile-xip-v1.js"></script>'
          if tag not in s:
              if old in s:
                  s=s.replace(old,tag,1)
              else:
                  if '</body>' not in s: raise SystemExit('index.html missing </body>')
                  s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          else:
              print('TAUR JOB FILE V2 already wired')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[github-actions]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire TAUR XIP Job File v2"
          git push
