name: TAUR MODULE WIRING V2

on:
  push:
    branches: [main]
    paths:
      - 'taur-*.js'
      - 'DETAILING_QC_ENGINE.js'
      - '.github/workflows/taur-module-wiring-v2.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure shared TAUR modules are wired
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="taur-data-controls-v1.js"></script>',
            '<script src="taur-pricebook-v1.js"></script>',
            '<script src="taur-jobfile-xip-v2.js"></script>',
            '<script src="taur-cloud-sync-v1.js"></script>',
            '<script src="taur-reinvestment-log-v1.js"></script>',
            '<script src="DETAILING_QC_ENGINE.js"></script>',
            '<script src="taur-operations-v1.js"></script>',
            '<script src="taur-growth-v1.js"></script>',
            '<script src="taur-integrity-v1.js"></script>',
            '<script src="taur-home-command-center-v1.js"></script>',
            '<script src="taur-customer-timeline-v1.js"></script>',
            '<script src="taur-vehicle-history-v1.js"></script>',
            '<script src="taur-growth-linking-v1.js"></script>',
            '<script src="taur-job-linking-v1.js"></script>',
            '<script src="taur-pricebook-bridge-v1.js"></script>',
            '<script src="taur-new-job-linking-v1.js"></script>',
            '<script src="taur-operational-ux-v1.js"></script>',
            '<script src="taur-field-ux-v1.js"></script>',
          ]
          if '</body>' not in s:
              raise SystemExit('index.html missing </body>')
          changed=False
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
                  changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          else:
              print('All shared TAUR modules already wired')
          PY
      - name: Ensure growth collections are synced
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('taur-cloud-sync-v1.js')
          s=p.read_text(encoding='utf-8')
          old="const COLLECTIONS=['customers','vehicles','jobs','quotes','payments','parts','pricing','tools','research','settings'];"
          new="const COLLECTIONS=['customers','vehicles','jobs','quotes','payments','parts','pricing','tools','research','settings','growth_leads','growth_estimates'];"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('Added shared growth collections')
          elif new in s:
              print('Growth collections already present')
          else:
              raise SystemExit('Could not locate TAUR cloud collection registry')
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html taur-cloud-sync-v1.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire TAUR field-first UX"
          git push
