name: TAUR Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Data Core tests
        run: node tools/taur-core-test-runner.js
      - name: Cloud reconciliation tests
        run: node tools/taur-cloud-reconciliation-test.js
      - name: Cloud contract tests
        run: node tools/taur-cloud-contract-test.js
      - name: Architecture lint
        run: node tools/taur-architecture-lint.js
